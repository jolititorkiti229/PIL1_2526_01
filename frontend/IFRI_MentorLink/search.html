<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rechercher un mentor — IFRI_MentorLink</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">Rechercher un mentor</div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="dot"></span>
        </button>
        <div class="avatar-btn"><a href="profile.html"><img src="https://i.pravatar.cc/80?img=47" alt="Avatar"/></a></div>
      </div>
    </div>

    <p class="page-subtitle" style="margin-bottom:20px;">Trouvez le mentor qui correspond à vos besoins.</p>

    <!-- FILTERS -->
    <div class="card mb-16" style="margin-bottom:20px;">
      <div class="search-filters">
        <div class="search-filter-group" style="flex:2;">
          <label class="search-filter-label">Matière</label>
          <select class="filter-select">
            <option>Toutes les matières</option>
            <option>Informatique</option>
            <option>Mathématiques</option>
            <option>Physique</option>
            <option>Génie Logiciel</option>
            <option>Réseaux</option>
            <option>Anglais</option>
            <option>Littérature</option>
          </select>
        </div>
        <div class="search-filter-group" style="flex:2;">
          <label class="search-filter-label">Filière</label>
          <select class="filter-select">
            <option>Toutes les filières</option>
            <option>L1</option>
            <option>L2</option>
            <option>L3</option>
            <option>M1</option>
          </select>
        </div>
        <div class="search-filter-group" style="flex:2;">
          <label class="search-filter-label">Niveau</label>
          <select class="filter-select">
            <option>Tous les niveaux</option>
            <option>L1 → L2</option>
            <option>L2 → L3</option>
            <option>L3 → M1</option>
          </select>
        </div>
        <div class="search-filter-group" style="flex:2;">
          <label class="search-filter-label">Disponibilité</label>
          <select class="filter-select">
            <option>Toutes</option>
            <option>Matin</option>
            <option>Après-midi</option>
            <option>Soir</option>
          </select>
        </div>
        <button class="btn btn-primary" style="margin-top:22px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Rechercher
        </button>
      </div>
    </div>

    <p class="results-count">Résultats trouvés (12)</p>

    <!-- RESULTS -->
    <div id="mentorResults"></div>

    <div style="text-align:center;margin-top:20px;">
      <button class="btn btn-outline">Voir plus de résultats</button>
    </div>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script>
renderSidebar('search');

const mentors = [
  { name:'Sophie Dossou', level:'L2 • Informatique', tags:['Python','Base de données'], dispo:'Mar 14h-16h, Mar 10h-12h', compat:89, img:'https://i.pravatar.cc/48?img=47', high:true },
  { name:'Arnaud Tchibazo', level:'L3 • Génie Logiciel', tags:['Java','Spring Boot','API REST'], dispo:'Mar 10h-11h, Jeu 9h-11h', compat:76, img:'https://i.pravatar.cc/48?img=12' },
  { name:'Marie Kakaï', level:'L3 • Mathématiques', tags:['Analyse','Algèbre','Statistiques'], dispo:'Ven 09h-10h, Sam 14h-16h', compat:72, img:'https://i.pravatar.cc/48?img=5' },
  { name:'Daniël Mèdénou', level:'L2 • Réseaux', tags:['Cisco','TCP/IP','Linux'], dispo:'Lun 14h-16h, Mer 10h-12h', compat:65, img:'https://i.pravatar.cc/48?img=33' },
];

function renderMentors() {
  const container = document.getElementById('mentorResults');
  container.innerHTML = mentors.map((m,i) => `
    <div class="mentor-card">
      <div class="mentor-avatar">
        <img src="${m.img}" alt="${m.name}" class="avatar avatar-md"/>
        <span class="status-dot online" style="position:absolute;bottom:2px;right:2px;border:2px solid #fff;"></span>
      </div>
      <div class="mentor-info">
        <div class="mentor-name">${m.name}</div>
        <div class="mentor-level">${m.level}</div>
        <div class="mentor-tags">
          ${m.tags.map(t=>`<span class="tag tag-${['blue','green','purple','orange'][i%4]}">${t}</span>`).join('')}
        </div>
        <div class="mentor-dispo">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-2px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Disponibilités : ${m.dispo}
        </div>
      </div>
      <div class="mentor-compat">
        <div class="compat-pct ${m.compat<80?'medium':''}">${m.compat}% <span class="compat-heart"></span></div>
        <div class="compat-label">Compatibilité</div>
        <a href="mentor-profile.html" class="btn btn-primary btn-sm" style="margin-top:10px;width:100%;">Voir profil</a>
      </div>
    </div>
  `).join('');
}
renderMentors();
</script>
</body>
</html>
