<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon profil — IFRI_MentorLink</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">Mon profil</div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Modifier le profil
        </button>
        <button class="topbar-icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <div class="avatar-btn"><a href="profile.html"><img src="https://i.pravatar.cc/80?img=47" alt="Avatar"/></a></div>
      </div>
    </div>

    <div class="profile-layout">
      <div style="display:flex;flex-direction:column;gap:20px;">
        <!-- Header -->
        <div class="card">
          <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
            <div style="position:relative;">
              <img src="https://i.pravatar.cc/90?img=47" alt="Sophie" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--primary-light);"/>
              <button style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              </button>
            </div>
            <div style="flex:1;">
              <div style="font-size:22px;font-weight:800;font-family:'Poppins',sans-serif;">Sophie Dossou</div>
              <div style="color:var(--text-muted);font-size:13px;margin-top:3px;">L2 • Informatique</div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
                <span class="stars">★★★★★</span>
                <span style="font-weight:700;">4.5</span>
                <span style="font-size:12px;color:var(--text-muted);">(12 avis)</span>
              </div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:5px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                Abidjan, Côte d'Ivoire
              </div>
            </div>
          </div>
        </div>

        <!-- Infos Form -->
        <div class="card">
          <div class="profile-section-title">Informations personnelles</div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Nom</label>
              <input class="form-input" value="Dossou"/>
            </div>
            <div class="form-group">
              <label class="form-label">Prénom</label>
              <input class="form-input" value="Sophie"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" value="sophie.dossou@ifri.ci"/>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Téléphone</label>
              <input class="form-input" value="+225 07 12 34 56"/>
            </div>
            <div class="form-group">
              <label class="form-label">Filière</label>
              <select class="form-select"><option selected>Informatique</option><option>Mathématiques</option></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">À propos de moi</label>
            <textarea class="form-input" rows="4">Passionnée par l'IA et le développement web. J'aime aider les autres à comprendre et à progresser dans les matières techniques.</textarea>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:8px;">
            <button class="btn btn-primary">Enregistrer</button>
          </div>
        </div>

        <!-- Competences -->
        <div class="card">
          <div class="profile-section-title">Compétences</div>
          <div class="skill-tags" style="margin-bottom:12px;">
            <span class="tag tag-blue">Python ×</span>
            <span class="tag tag-purple">Machine Learning ×</span>
            <span class="tag">SQL ×</span>
            <span class="tag tag-orange">HTML/CSS ×</span>
            <span class="tag tag-green">JavaScript ×</span>
          </div>
          <div style="display:flex;gap:10px;">
            <input class="form-input" placeholder="Ajouter une compétence..." style="max-width:240px;"/>
            <button class="btn btn-primary btn-sm">Ajouter</button>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="card">
          <div class="profile-section-title">Disponibilités</div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <label style="width:80px;font-size:13px;font-weight:700;">Lundi</label>
              <input class="form-input" value="14h – 16h" style="flex:1;padding:8px;"/>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <label style="width:80px;font-size:13px;font-weight:700;">Mercredi</label>
              <input class="form-input" value="10h – 12h" style="flex:1;padding:8px;"/>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <label style="width:80px;font-size:13px;font-weight:700;">Vendredi</label>
              <input class="form-input" value="15h – 17h" style="flex:1;padding:8px;"/>
            </div>
            <button class="btn btn-outline btn-sm" style="margin-top:4px;">+ Ajouter un créneau</button>
          </div>
        </div>

        <div class="card">
          <div class="profile-section-title">Informations</div>
          <div class="info-row"><span class="info-key">Filière</span><span class="info-val">Informatique</span></div>
          <div class="info-row"><span class="info-key">Niveau</span><span class="info-val">L2</span></div>
          <div class="info-row"><span class="info-key">Email</span><span class="info-val" style="font-size:11.5px;">sophie.dossou@ifri.ci</span></div>
          <div class="info-row"><span class="info-key">Téléphone</span><span class="info-val">+225 07 12 34 56</span></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script>renderSidebar('profile');</script>
</body>
</html>
