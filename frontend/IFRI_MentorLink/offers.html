<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mes offres / demandes — IFRI_MentorLink</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">Mes offres / demandes</div>
      <div class="topbar-actions">
        <button class="create-offer-btn" onclick="openModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Créer une nouvelle offre
        </button>
        <button class="topbar-icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <div class="avatar-btn"><a href="profile.html"><img src="https://i.pravatar.cc/80?img=47" alt="Avatar"/></a></div>
      </div>
    </div>

    <div class="card">
      <div class="offers-tabs">
        <button class="offer-tab active" onclick="switchTab(this,'published')">Offres publiées</button>
        <button class="offer-tab" onclick="switchTab(this,'sent')">Demandes envoyées</button>
      </div>

      <div id="tabPublished">
        <table class="offers-table">
          <thead>
            <tr>
              <th>Titre</th>
              <th>Matière</th>
              <th>Public</th>
              <th>Statut</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="publishedBody"></tbody>
        </table>
      </div>

      <div id="tabSent" style="display:none;">
        <table class="offers-table">
          <thead>
            <tr>
              <th>Titre</th>
              <th>Matière</th>
              <th>Public</th>
              <th>Statut</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="sentBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;display:none;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:32px;width:480px;max-width:95vw;">
    <div class="flex-between mb-16">
      <h3 style="font-size:18px;font-weight:700;">Créer une nouvelle offre</h3>
      <button onclick="closeModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted);">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Titre</label>
      <input type="text" class="form-input" placeholder="Ex: Aide en Programmation Python"/>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Matière</label>
        <select class="form-select"><option>Python</option><option>Mathématiques</option><option>SQL</option><option>JavaScript</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">Niveau public</label>
        <select class="form-select"><option>L1</option><option>L1 – L2</option><option>L2 – L3</option><option>Tous</option></select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-input" rows="3" placeholder="Décrivez ce que vous proposez..."></textarea>
    </div>
    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px;">
      <button onclick="closeModal()" class="btn btn-outline">Annuler</button>
      <button onclick="closeModal()" class="btn btn-primary">Publier</button>
    </div>
  </div>
</div>

<script src="js/sidebar.js"></script>
<script>
renderSidebar('offers');

const published = [
  { title:'Aide en Python', subject:'Python', level:'L1 – L2', status:'Acceptée', date:'12/05/2025', statusClass:'badge-success' },
  { title:'Soutien en Base de données', subject:'SQL', level:'L1 – L3', status:'En attente', date:'10/05/2025', statusClass:'badge-warning' },
  { title:'Initiation au JavaScript', subject:'JavaScript', level:'L1 – L2', status:'En cours', date:'05/05/2025', statusClass:'badge-info' },
  { title:'Aide en Mathématiques', subject:'Mathématiques', level:'L1', status:'Refusée', date:'01/05/2025', statusClass:'badge-danger' },
];

const sent = [
  { title:'Cours d\'Algorithme', subject:'Algo', level:'L2 – L3', status:'En attente', date:'11/05/2025', statusClass:'badge-warning' },
  { title:'Soutien en Physique', subject:'Physique', level:'L1', status:'Acceptée', date:'08/05/2025', statusClass:'badge-success' },
];

function renderTable(data, bodyId) {
  document.getElementById(bodyId).innerHTML = data.map(r => `
    <tr>
      <td><strong>${r.title}</strong></td>
      <td>${r.subject}</td>
      <td>${r.level}</td>
      <td><span class="badge ${r.statusClass}">${r.status}</span></td>
      <td style="color:var(--text-muted);">${r.date}</td>
    </tr>
  `).join('');
}

renderTable(published, 'publishedBody');
renderTable(sent, 'sentBody');

function switchTab(btn, tab) {
  document.querySelectorAll('.offer-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabPublished').style.display = tab === 'published' ? '' : 'none';
  document.getElementById('tabSent').style.display = tab === 'sent' ? '' : 'none';
}

function openModal() {
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>
</body>
</html>
