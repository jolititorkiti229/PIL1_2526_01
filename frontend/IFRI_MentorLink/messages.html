<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messagerie — IFRI_MentorLink</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <!-- main-content--messages neutralise le padding et occupe 100vh -->
  <main class="main-content main-content--messages">

    <!-- TOPBAR intégré dans le flux colonne -->
    <div class="messages-topbar">
      <div class="topbar-title">Messagerie</div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn" onclick="location.href='notifications.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <span class="dot"></span>
        </button>
        <a href="profile.html" class="avatar-btn">
          <img src="https://i.pravatar.cc/80?img=47" alt="Mon profil"/>
        </a>
      </div>
    </div>

    <!-- GRILLE chat : panel gauche + zone droite -->
    <div class="messages-layout">

      <!-- ── LISTE CONVERSATIONS ── -->
      <div class="conv-list">
        <div class="conv-search">
          <div class="conv-search-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input class="conv-search-input" placeholder="Rechercher une conversation" type="text" id="searchConv"/>
          </div>
        </div>
        <div class="conv-items" id="convList"></div>
      </div>

      <!-- ── ZONE CHAT ── -->
      <div class="chat-area">

        <!-- En-tête du chat -->
        <div class="chat-header">
          <div style="position:relative; flex-shrink:0;">
            <img src="https://i.pravatar.cc/44?img=47" alt="" class="avatar avatar-md"/>
            <span class="status-dot online" style="position:absolute;bottom:1px;right:1px;border:2px solid #fff;width:11px;height:11px;"></span>
          </div>
          <div>
            <div class="chat-header-name">Sophie Dossou</div>
            <div class="chat-header-status">● En ligne</div>
          </div>
          <div class="chat-header-actions">
            <button class="chat-header-btn" title="Voir le profil" onclick="location.href='mentor-profile.html'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </button>
            <button class="chat-header-btn" title="Appel vidéo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
            </button>
            <button class="chat-header-btn" title="Plus d'options">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">

          <div class="chat-date-sep"><span>Aujourd'hui</span></div>

          <!-- Message reçu -->
          <div class="msg-group in">
            <div class="msg-group-sender">
              <img src="https://i.pravatar.cc/28?img=47" class="msg-sender-avatar" alt=""/>
              <div>
                <div class="msg-bubble incoming">Bonjour Emmanuel ! 👋</div>
                <div class="msg-time">10:14</div>
              </div>
            </div>
          </div>

          <!-- Message envoyé -->
          <div class="msg-group out">
            <div class="msg-group-sender out">
              <div>
                <div class="msg-bubble outgoing">J'ai vu ta demande en Mathématiques.</div>
                <div class="msg-time out">10:16</div>
              </div>
            </div>
          </div>

          <!-- Message reçu -->
          <div class="msg-group in">
            <div class="msg-group-sender">
              <img src="https://i.pravatar.cc/28?img=47" class="msg-sender-avatar" alt=""/>
              <div>
                <div class="msg-bubble incoming">Je suis disponible lundi à 14h, ça te convient ?</div>
                <div class="msg-time">10:18</div>
              </div>
            </div>
          </div>

          <!-- Messages envoyés groupés -->
          <div class="msg-group out">
            <div class="msg-group-sender out">
              <div>
                <div class="msg-bubble outgoing">Oui, ça me convient très bien ! 😊</div>
                <div class="msg-time out">10:19</div>
              </div>
            </div>
          </div>

          <!-- Message reçu -->
          <div class="msg-group in">
            <div class="msg-group-sender">
              <img src="https://i.pravatar.cc/28?img=47" class="msg-sender-avatar" alt=""/>
              <div>
                <div class="msg-bubble incoming">Parfait, à demain alors ! 😊</div>
                <div class="msg-time">10:20</div>
              </div>
            </div>
          </div>

          <div class="msg-group out">
            <div class="msg-group-sender out">
              <div>
                <div class="msg-bubble outgoing">Parfait, à demain alors !</div>
                <div class="msg-time out">10:21</div>
              </div>
            </div>
          </div>

        </div>

        <!-- Zone de saisie -->
        <div class="chat-input-area">
          <button class="chat-attach-btn" title="Joindre un fichier">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input
            class="chat-input"
            id="msgInput"
            placeholder="Écrivez un message…"
            type="text"
            autocomplete="off"
            onkeydown="sendMsg(event)"
          />
          <button class="chat-send-btn" onclick="sendMsg({key:'Enter'})" title="Envoyer">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>

      </div><!-- /chat-area -->
    </div><!-- /messages-layout -->
  </main>
</div>

<script src="js/sidebar.js"></script>
<script>
renderSidebar('messages');

/* ── Données conversations ── */
const conversations = [
  { name:'Sophie Dossou',  preview:'Parfait, à demain alors !', time:'10:30', unread:4, img:'https://i.pravatar.cc/40?img=47', online:true,  active:true  },
  { name:'Arnaud Tchibazo',preview:'Ok, je suis disponible.',   time:'Hier',  unread:0, img:'https://i.pravatar.cc/40?img=12', online:true,  active:false },
  { name:'Jean F.',        preview:'Ok, je suis disponible.',   time:'Hier',  unread:0, img:'https://i.pravatar.cc/40?img=20', online:false, active:false },
  { name:'Marie Kakaï',   preview:"Je t'envoie le document.",  time:'3j',    unread:0, img:'https://i.pravatar.cc/40?img=5',  online:false, active:false },
  { name:'Daniël M.',     preview:"D'accord.",                 time:'3j',    unread:0, img:'https://i.pravatar.cc/40?img=33', online:false, active:false },
];

function renderConvList(filter='') {
  const filtered = conversations.filter(c =>
    c.name.toLowerCase().includes(filter.toLowerCase())
  );
  document.getElementById('convList').innerHTML = filtered.map(c => `
    <div class="conv-item ${c.active ? 'active' : ''}" onclick="selectConv(this, '${c.name}', '${c.img}', ${c.online})">
      <div style="position:relative; flex-shrink:0;">
        <img src="${c.img}" alt="${c.name}" class="avatar avatar-sm"/>
        <span class="status-dot ${c.online ? 'online' : 'offline'}"
          style="position:absolute;bottom:0;right:0;border:2px solid #fff;width:10px;height:10px;"></span>
      </div>
      <div class="conv-item-info">
        <div class="conv-name">${c.name}</div>
        <div class="conv-preview">${c.preview}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time">${c.time}</div>
        ${c.unread ? `<div class="conv-unread">${c.unread}</div>` : ''}
      </div>
    </div>
  `).join('');
}
renderConvList();

/* Filtre de recherche */
document.getElementById('searchConv').addEventListener('input', e => {
  renderConvList(e.target.value);
});

/* Sélection conversation */
function selectConv(el, name, img, online) {
  document.querySelectorAll('.conv-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.querySelector('.chat-header-name').textContent = name;
  document.querySelector('.chat-header .avatar').src = img.replace('40','44');
  document.querySelector('.chat-header-status').textContent = online ? '● En ligne' : '○ Hors ligne';
  document.querySelector('.chat-header-status').style.color = online ? 'var(--success)' : 'var(--text-muted)';
  document.querySelector('.msg-sender-avatar').src = img.replace('40','28');
}

/* Envoi de message */
function sendMsg(e) {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const msgs = document.getElementById('chatMessages');
  const now = new Date();
  const hhmm = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  const group = document.createElement('div');
  group.className = 'msg-group out';
  group.innerHTML = `
    <div class="msg-group-sender out">
      <div>
        <div class="msg-bubble outgoing">${text}</div>
        <div class="msg-time out">${hhmm}</div>
      </div>
    </div>`;
  msgs.appendChild(group);
  msgs.scrollTop = msgs.scrollHeight;
  input.value = '';
}
</script>
</body>
</html>
