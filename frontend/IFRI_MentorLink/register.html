<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S'inscrire — IFRI_MentorLink</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <style>
    .auth-left { background: linear-gradient(145deg, #2e1a8e, #5B3FF8 60%, #00b09b); }
    .check-graphic { width: 120px; height: 120px; margin: 0 auto; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="auth-body">

<div class="auth-layout">
  <!-- LEFT PANEL -->
  <div class="auth-left">
    <div class="auth-left-inner">
      <a href="index.html" class="logo-mark mb-auth">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#fff"/>
            <path d="M2 17l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <path d="M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text" style="color:#fff;">IFRI_<span style="color:#c4b8fa;">MentorLink</span></span>
      </a>
      <div class="check-graphic">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="auth-left-tagline">
        <h2>Rejoignez la communauté</h2>
        <p>Créez votre compte et commencez votre aventure de mentorat.</p>
      </div>
      <img src="https://illustrations.popsy.co/purple/remote-work.svg" alt="" style="width:220px;margin-top:28px;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.2))"/>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-right" style="overflow-y:auto; padding: 32px 40px;">
    <div class="auth-form-container">
      <h2 class="auth-title">Créer un compte</h2>
      <p class="auth-subtitle">Rejoignez IFRI_MentorLink dès aujourd'hui.</p>

      <form class="auth-form" onsubmit="return handleRegister(event)">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Nom</label>
            <input type="text" class="form-input" placeholder="Entrez votre nom"/>
          </div>
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-input" placeholder="Entrez votre prénom"/>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="Entrez votre email"/>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Téléphone</label>
            <input type="tel" class="form-input" placeholder="Entrez votre numéro"/>
          </div>
          <div class="form-group">
            <label class="form-label">Filière</label>
            <select class="form-select">
              <option value="">Sélectionnez votre filière</option>
              <option>Informatique</option>
              <option>Mathématiques</option>
              <option>Physique</option>
              <option>Génie Logiciel</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Niveau d'étude</label>
            <select class="form-select">
              <option value="">Sélectionnez votre niveau</option>
              <option>L1</option>
              <option>L2</option>
              <option>L3</option>
              <option>M1</option>
              <option>M2</option>
            </select>
          </div>
          <div class="form-group" style="visibility:hidden;"></div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <div class="input-icon-wrap">
              <input type="password" class="form-input" placeholder="Entrez un mot de passe" id="pw1"/>
              <button type="button" class="pw-toggle" onclick="togglePw('pw1',this)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirmer le mot de passe</label>
            <div class="input-icon-wrap">
              <input type="password" class="form-input" placeholder="Confirmez votre niveau" id="pw2"/>
              <button type="button" class="pw-toggle" onclick="togglePw('pw2',this)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary mt-8" style="width:100%;padding:13px;">S'inscrire</button>

        <p class="auth-switch">
          Déjà un compte ? <a href="login.html" class="auth-link">Se connecter</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; }
  else { inp.type = 'password'; }
}
function handleRegister(e) {
  e.preventDefault();
  window.location.href = 'dashboard.html';
  return false;
}
</script>
</body>
</html>
