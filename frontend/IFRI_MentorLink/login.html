<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Se connecter — IFRI_MentorLink</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body class="auth-body">

<div class="auth-layout">
  <!-- LEFT PANEL -->
  <div class="auth-left">
    <div class="auth-left-inner">
      <a href="index.html" class="logo-mark mb-auth">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#fff"/>
            <path d="M2 17l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <path d="M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text" style="color:#fff;">IFRI_<span style="color:#c4b8fa;">MentorLink</span></span>
      </a>
      <div class="auth-left-building">
        <img src="img/screen.png" alt="IFRI" style="border-radius: 100%;" class="building-img" onerror="this.style.display='none'"/>
      </div>
      <div class="auth-left-tagline">
        <h2>Bienvenue de retour !</h2>
        <p>Connectez-vous pour continuer votre expérience.</p>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-right">
    <div class="auth-form-container">
      <h2 class="auth-title">Se connecter</h2>
      <p class="auth-subtitle">Connectez-vous pour continuer votre expérience.</p>

      <form class="auth-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email ou téléphone</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" class="form-input with-icon" placeholder="Entrez votre email ou téléphone"/>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" class="form-input with-icon" placeholder="Entrez votre mot de passe" id="pwInput"/>
            <button type="button" class="pw-toggle" onclick="togglePw('pwInput', this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="forgot-link-wrap">
          <a href="#" class="forgot-link">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:13px;">Se connecter</button>

        <p class="auth-switch">
          Pas encore de compte ? <a href="register.html" class="auth-link">S'inscrire</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'; }
  else { inp.type = 'password'; btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; }
}
function handleLogin(e) {
  e.preventDefault();
  window.location.href = 'dashboard.html';
  return false;
}
</script>
</body>
</html>
