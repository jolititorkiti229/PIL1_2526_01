<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications — IFRI_MentorLink</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">Notifications</div>
      <div class="topbar-actions">
        <button class="mark-all-btn">Tout marquer comme lu</button>
        <button class="topbar-icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="dot"></span>
        </button>
        <div class="avatar-btn"><a href="profile.html"><img src="https://i.pravatar.cc/80?img=47" alt="Avatar"/></a></div>
      </div>
    </div>

    <div class="card" style="padding:0;">
      <div id="notifList"></div>
      <div style="padding:16px;text-align:center;">
        <button class="btn btn-outline btn-sm">Voir toutes les notifications</button>
      </div>
    </div>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script>
renderSidebar('notifications');

const notifications = [
  { dot:'green', text:'Jean Frédéric a accepté votre demande de mentorat.', time:'il y a 5 minutes', unread:true },
  { dot:'blue', text:'Vous avez un nouveau message de Sophie Dossou.', time:'il y a 30 minutes', unread:true },
  { dot:'purple', text:'Une nouvelle correspondance a été trouvée pour vous.', time:'il y a 1 heure', unread:true },
  { dot:'yellow', text:'Marie Kakaï a évalué votre session.', time:'il y a 2 heures', unread:false },
  { dot:'gray', text:'Votre offre de mentorat a été consultée par 3 étudiants.', time:'il y a 1 jour', unread:false },
];

document.getElementById('notifList').innerHTML = notifications.map(n => `
  <div class="notif-item ${n.unread?'unread':''}">
    <div class="notif-dot ${n.dot}"></div>
    <div class="notif-content">
      <div class="notif-text">${n.text}</div>
      <div class="notif-time">${n.time}</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
`).join('');

document.querySelector('.mark-all-btn').addEventListener('click', () => {
  document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
});
</script>
</body>
</html>
