{% extends "accounts/base_accounts.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Reinitialiser le mot de passe</h1>
        <p class="text-muted">Entre ton adresse email pour recevoir un lien de reinitialisation.</p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Envoyer le lien</button>
        </form>
        <p class="mt-3 mb-0">
          <a href="{% url 'login' %}">Retour a la connexion</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
