{% extends "accounts/base_accounts.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Connexion</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
        <p class="mt-3 mb-0">
          Pas encore de compte ?
          <a href="{% url 'register' %}">Creer un compte</a>
        </p>
        <p class="mt-2 mb-0">
          <a href="{% url 'password_reset' %}">Mot de passe oublie ?</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
