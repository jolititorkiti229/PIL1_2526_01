{% extends "accounts/base_accounts.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        {% if validlink %}
          <h1 class="h4 mb-3">Nouveau mot de passe</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Changer le mot de passe</button>
          </form>
        {% else %}
          <h1 class="h4 mb-3">Lien invalide</h1>
          <p>Le lien de reinitialisation est invalide ou a deja ete utilise.</p>
          <a href="{% url 'password_reset' %}" class="btn btn-primary">Demander un nouveau lien</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
