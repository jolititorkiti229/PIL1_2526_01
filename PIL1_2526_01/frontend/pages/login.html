<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Se connecter — IFRI_MentorLink</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(135deg, #EEF2FF 0%, #F8F7FF 50%, #F0FDFA 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-container { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; width: 100%; }
    .auth-left {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px; color: #fff; position: relative; overflow: hidden;
    }
    .auth-left::before {
      content:''; position:absolute; top:-100px; right:-100px;
      width:400px; height:400px; background:rgba(255,255,255,.08); border-radius:50%;
    }
    .auth-left::after {
      content:''; position:absolute; bottom:-80px; left:-80px;
      width:300px; height:300px; background:rgba(255,255,255,.06); border-radius:50%;
    }
    .auth-left-content { position:relative; z-index:1; text-align:center; }
    .auth-left .illus { font-size:90px; margin-bottom:32px; }
    .auth-left h2 { color:#fff; font-size:2.2rem; margin-bottom:16px; }
    .auth-left p { color:rgba(255,255,255,.8); font-size:16px; line-height:1.7; }
    .auth-right {
      display:flex; align-items:center; justify-content:center;
      padding:60px 80px; background:#fff;
    }
    .auth-form { width:100%; max-width:420px; }
    .auth-logo { display:flex; align-items:center; gap:10px; margin-bottom:40px; }
    .auth-logo .logo-icon { width:40px; height:40px; background:var(--primary); border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .auth-logo span { font-family:'Syne',sans-serif; font-size:17px; font-weight:800; }
    .auth-form h1 { font-size:1.8rem; margin-bottom:8px; }
    .auth-form > p { margin-bottom:32px; }
    .divider { text-align:center; color:var(--text-muted); font-size:13px; margin:20px 0; position:relative; }
    .divider::before, .divider::after { content:''; position:absolute; top:50%; width:42%; height:1px; background:var(--border); }
    .divider::before { left:0; } .divider::after { right:0; }
    .auth-footer { text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted); }
    .auth-footer a { color:var(--primary); font-weight:600; }
    .input-with-icon { position:relative; }
    .input-with-icon .form-control { padding-right:44px; }
    .input-with-icon .toggle-pw { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:16px; }
    @media(max-width:768px) { .auth-container{grid-template-columns:1fr} .auth-left{display:none} .auth-right{padding:40px 24px} }
  </style>
</head>
<body>
<div class="auth-container">
  <div class="auth-left">
    <div class="auth-left-content">
      <div class="illus">🏫</div>
      <h2>Bienvenue de retour !</h2>
      <p>Connectez-vous pour continuer votre expérience de mentorat sur IFRI_MentorLink.</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-form">
      <div class="auth-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span>IFRI_MentorLink</span>
      </div>

      <h1>Se connecter</h1>
      <p>Accédez à votre espace de mentorat.</p>

      <div id="error-msg" class="hidden" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:13px;font-weight:500"></div>

      <form id="login-form" style="display:flex;flex-direction:column;gap:16px">
        <div class="form-group">
          <label class="form-label">Email ou téléphone</label>
          <input type="text" id="identifier" class="form-control" placeholder="Entrez votre email ou téléphone" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-with-icon">
            <input type="password" id="password" class="form-control" placeholder="Entrez votre mot de passe" required>
            <button type="button" class="toggle-pw" onclick="togglePassword()">👁</button>
          </div>
        </div>
        <div style="text-align:right">
          <a href="#" style="font-size:13px;color:var(--primary);font-weight:500">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn">
          Se connecter
        </button>
      </form>

      <div class="auth-footer">
        Pas encore de compte ? <a href="/pages/register.html">S'inscrire</a>
      </div>
      <div style="margin-top:16px;text-align:center">
        <a href="/pages/index.html" style="font-size:13px;color:var(--text-muted)">← Retour à l'accueil</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script>
  // Check si déjà connecté
  checkAuth(false).then(user => {
    if (user) window.location.href = '/pages/dashboard.html';
  });

  function togglePassword() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    errEl.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div>';

    try {
      await api('/auth/login', {
        method: 'POST',
        body: {
          identifier: document.getElementById('identifier').value.trim(),
          password: document.getElementById('password').value
        }
      });
      showToast('Connexion réussie !', 'success');
      setTimeout(() => window.location.href = '/pages/dashboard.html', 500);
    } catch (err) {
      errEl.textContent = err.message || 'Identifiant ou mot de passe incorrect';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = 'Se connecter';
    }
  });
</script>
</body>
</html>
